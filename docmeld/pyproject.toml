[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docmeld"
version = "0.3.0"
description = "Lightweight PDF, Word & PowerPoint to agent-ready knowledge pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "DocMeld Contributors", email = "hello@agentii.xyz"}
]
keywords = ["pdf", "docx", "pptx", "powerpoint", "word", "parsing", "agents", "llm", "document-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "pymupdf4llm>=0.0.10",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain-deepseek>=0.1.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0.0"]
pptx = ["python-pptx>=0.6.23"]
office = ["docling>=2.0.0", "python-pptx>=0.6.23"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/agentii-ai/DocMeld"
Repository = "https://github.com/agentii-ai/DocMeld"
Documentation = "https://github.com/agentii-ai/DocMeld#readme"
Changelog = "https://github.com/agentii-ai/DocMeld/blob/main/docmeld/CHANGELOG.md"
Issues = "https://github.com/agentii-ai/DocMeld/issues"

[project.scripts]
docmeld = "docmeld.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["docmeld*"]

[tool.setuptools.package-data]
docmeld = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PLE", "PLW", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["RUF001"]  # intentional full-width characters in Chinese prompts

[tool.mypy]
python_version = "3.9"
files = ["docmeld"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# Third-party packages that ship no type stubs / py.typed marker.
# follow_imports = skip stops mypy from analyzing these heavy optional deps
# (docling pulls in torch, whose sources aren't py3.9-clean).
[[tool.mypy.overrides]]
module = [
    "fitz",
    "fitz.*",
    "pymupdf4llm",
    "pymupdf4llm.*",
    "docling",
    "docling.*",
    "torch",
    "torch.*",
    "pptx",
    "pptx.*",
    "langchain_deepseek",
    "langchain_deepseek.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]

[tool.coverage.run]
source = ["docmeld"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
